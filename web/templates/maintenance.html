<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mantenimiento - Marina Ojeda LMS</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #38bdf8;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Georgia, "Times New Roman", serif;
            background:
                radial-gradient(ellipse at top, #1e3a5f 0%, transparent 55%),
                var(--bg);
            color: var(--text);
            padding: 1.5rem;
        }
        main {
            max-width: 34rem;
            width: 100%;
            background: var(--card);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 2.25rem 2rem;
            text-align: center;
        }
        h1 {
            margin: 0 0 0.75rem;
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--accent);
        }
        p {
            margin: 0.6rem 0;
            line-height: 1.5;
            color: var(--muted);
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 1rem;
        }
        .brand {
            font-family: system-ui, -apple-system, sans-serif;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            font-size: 0.75rem;
            color: #64748b;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <main>
        <div class="brand">Marina Ojeda LMS</div>
        <h1>Sitio en mantenimiento</h1>
        <p>Estamos migrando el servicio a un servidor nuevo.</p>
        <p>En unos minutos vas a poder ingresar normalmente. Gracias por la paciencia.</p>
    </main>
</body>
</html>
