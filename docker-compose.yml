services:
  db:
    image: mariadb:10.11
    container_name: db_service_lms_brazil
    restart: always
    volumes:
      - ./mariadb_data:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    # Sin healthcheck, `web` arrancaba apenas existia el contenedor de la base, no
    # cuando la base aceptaba conexiones. Al reiniciar el VPS eso era una carrera.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: web_lms_app_brazil
    restart: always
    volumes:
      - ./web:/app
      - /home/ubuntu/marinaOjedaS3:/home/ubuntu/marinaOjedaS3:rw
    # El comando vive en entrypoint.sh (collectstatic + migrate + gunicorn).
    # Antes era `runserver 0.0.0.0:8000 --noreload`, el servidor de desarrollo.
    #
    # Ya NO se publica el puerto 5801 en el host. Estaba expuesto a internet en texto
    # plano y salteaba Traefik: se podia entrar por http://<ip>:5801 y las
    # contrasenas del login viajaban sin cifrar. El sitio se sirve solo por Traefik
    # (red traefik, TLS de Cloudflare), que llega al contenedor por el puerto 8000
    # interno segun traefik/dynamic.yml.
    env_file:
      - ./.env
    environment:
      TZ: America/Argentina/Buenos_Aires
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # /healthz comprueba proceso + base, y esta exento del modo mantenimiento.
      # X-Forwarded-Proto para que SECURE_SSL_REDIRECT no responda un 301 al chequeo.
      test: ["CMD", "curl", "-fsS", "-H", "X-Forwarded-Proto: https", "-H", "Host: marinaojeda.ar", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
      - traefik

networks:
  traefik:
    external: true
    name: traefik_default
